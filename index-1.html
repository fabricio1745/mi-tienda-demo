<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Tienda Demo</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:Arial,sans-serif;background:#f5f5f5;color:#222}
header{background:#111;color:white;padding:22px 16px;text-align:center}
header h1{margin:0 0 6px;font-size:28px} header p{margin:0;color:#ccc}
.container{max-width:900px;margin:auto;padding:18px}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.card{background:white;border-radius:14px;padding:16px;box-shadow:0 2px 10px #0001}
.pic{height:140px;border-radius:10px;background:#ddd;display:flex;align-items:center;justify-content:center;font-size:50px;margin-bottom:12px}
.card h3{margin:5px 0}.price{font-size:21px;font-weight:bold}.stock{font-size:14px;color:#555;margin:7px 0 12px}
.controls{display:flex;gap:8px;align-items:center}.controls button{width:38px;height:38px;border:0;border-radius:8px;font-size:20px;cursor:pointer}
.qty{min-width:28px;text-align:center;font-weight:bold}.add{flex:1;background:#111;color:white;border:0;border-radius:8px;padding:11px;cursor:pointer}
.cart{margin-top:24px;background:white;border-radius:14px;padding:18px;box-shadow:0 2px 10px #0001}
.cart h2{margin-top:0}.line{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #eee}
.total{text-align:right;font-size:22px;font-weight:bold;margin:16px 0}
input{width:100%;padding:12px;border:1px solid #ccc;border-radius:8px;margin:5px 0 12px}
.wa{display:block;width:100%;padding:14px;text-align:center;background:#25D366;color:white;text-decoration:none;border-radius:9px;font-weight:bold;border:0;cursor:pointer;font-size:16px}
.empty{color:#777;text-align:center;padding:10px}
</style>
</head>
<body>
<header><h1>🛍️ Mi Tienda Demo</h1><p>Catálogo de demostración</p></header>
<div class="container">
<h2>Productos</h2>
<div class="products" id="products"></div>

<div class="cart">
<h2>🛒 Tu pedido</h2>
<div id="cart"><div class="empty">Todavía no agregaste productos.</div></div>
<div class="total" id="total">Total: $0</div>
<input id="name" placeholder="Tu nombre">
<input id="phone" placeholder="Tu teléfono (opcional)">
<button class="wa" onclick="sendWhatsApp()">📲 Enviar pedido por WhatsApp</button>
</div>
</div>

<script>
const products=[
 {id:1,name:"Producto A",price:500,stock:10,emoji:"📦"},
 {id:2,name:"Producto B",price:750,stock:5,emoji:"🎁"},
 {id:3,name:"Producto C",price:1200,stock:2,emoji:"⭐"}
];
const cart={};

function money(n){return "$"+n.toLocaleString("es-UY")}
function renderProducts(){
 const el=document.getElementById("products");
 el.innerHTML=products.map(p=>`
 <div class="card">
  <div class="pic">${p.emoji}</div>
  <h3>${p.name}</h3>
  <div class="price">${money(p.price)}</div>
  <div class="stock">Stock disponible: ${p.stock}</div>
  <div class="controls">
   <button onclick="changeQty(${p.id},-1)">−</button>
   <span class="qty" id="q${p.id}">0</span>
   <button onclick="changeQty(${p.id},1)">+</button>
   <button class="add" onclick="add(${p.id})">Agregar</button>
  </div>
 </div>`).join("");
}
function changeQty(id,d){
 const p=products.find(x=>x.id===id);
 const current=cart[id]||0;
 const next=Math.max(0,Math.min(p.stock,current+d));
 document.getElementById("q"+id).textContent=next;
}
function add(id){
 const q=Number(document.getElementById("q"+id).textContent);
 if(q>0) cart[id]=q;
 renderCart();
}
function renderCart(){
 const el=document.getElementById("cart");
 let total=0;
 const ids=Object.keys(cart);
 if(!ids.length){el.innerHTML='<div class="empty">Todavía no agregaste productos.</div>';document.getElementById("total").textContent="Total: $0";return}
 el.innerHTML=ids.map(id=>{
  const p=products.find(x=>x.id==id), q=cart[id], sub=p.price*q; total+=sub;
  return `<div class="line"><span>${q} × ${p.name}</span><b>${money(sub)}</b></div>`;
 }).join("");
 document.getElementById("total").textContent="Total: "+money(total);
}
function sendWhatsApp(){
 const ids=Object.keys(cart);
 if(!ids.length){alert("Agregá al menos un producto.");return}
 let msg="🛒 *NUEVO PEDIDO - Mi Tienda Demo*%0A%0A";
 let total=0;
 ids.forEach(id=>{
  const p=products.find(x=>x.id==id),q=cart[id],sub=p.price*q; total+=sub;
  msg+=`${q} × ${encodeURIComponent(p.name)} — ${money(sub)}%0A`;
 });
 msg+=`%0A*Total: ${money(total)}*`;
 const name=document.getElementById("name").value.trim();
 const phone=document.getElementById("phone").value.trim();
 if(name) msg+=`%0ACliente: ${encodeURIComponent(name)}`;
 if(phone) msg+=`%0ATeléfono: ${encodeURIComponent(phone)}`;
 // Número de DEMO. Se reemplaza por el WhatsApp real de la empresa.
 const whatsapp="59800000000";
 window.open("https://wa.me/"+whatsapp+"?text="+msg,"_blank");
}
renderProducts(); renderCart();
</script>
</body>
</html>
